name: Windows native candidate

on:
  workflow_dispatch:
    inputs:
      local_only:
        description: Build and verify the M2 callback-only decoder
        type: boolean
        default: false
      verify_no_output:
        description: Test WASAPI error handling on a runner with zero active render endpoints
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  candidate:
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.17.0"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5
      - run: rustup toolchain install 1.100.0 --profile minimal
      - run: bun install --frozen-lockfile
      - name: Build pinned mpv, FFmpeg and libplacebo sources
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'echo-m0-kit'
          ./native/windows-x64/prepare.ps1 -Root $root
          $env:MSYSTEM = 'UCRT64'
          $profile = if ('${{ inputs.local_only }}' -eq 'true') { 'local' } else { 'feasibility' }
          & "$root/msys64/usr/bin/bash.exe" -l -c 'root="$(cygpath -u "$1")"; bash "$root/build.sh" "$root" 4 "$2"' echo $root $profile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage and test native resources
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'echo-m0-kit'
          $stage = Join-Path $env:RUNNER_TEMP 'ECHO native próba 日本'
          $localOnly = '${{ inputs.local_only }}' -eq 'true'
          ./native/windows-x64/stage.ps1 -Root $root -Destination $stage -LocalOnly:$localOnly
          ./native/windows-x64/collect-sources.ps1 -ResourceRoot $stage -SourceCache "$root/package-sources"
          foreach ($name in 'dlls.json', 'inventory.json', 'source-inventory.json') {
            $evidence = if ($localOnly) { './native/windows-x64/evidence/local' } else { './native/windows-x64/evidence' }
            $expected = (Get-Content "$evidence/$name" -Raw) -replace '\r\n', "`n"
            $built = (Get-Content "$stage/$name" -Raw) -replace '\r\n', "`n"
            if ($built -cne $expected) { throw "Native rebuild differs: $name" }
          }
          if ($localOnly) {
            ./native/windows-x64/test-local.ps1 -ResourceRoot $stage
            ./native/windows-x64/test-live.ps1 -ResourceRoot $stage
          } else {
            ./native/windows-x64/test-installed.ps1 -ResourceRoot $stage
          }
          ./native/windows-x64/collect-notices.ps1 -Root $root -ResourceRoot $stage -SourceCache "$root/package-sources"
          ./native/windows-x64/package-sources.ps1 -Root $root -ResourceRoot $stage -SourceCache "$root/package-sources" -Destination "$root/source-review"
      - name: Build and smoke-test a private NSIS package
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'ECHO native próba 日本'
          $localOnly = '${{ inputs.local_only }}' -eq 'true'
          ./native/windows-x64/bundle-candidate.ps1 -ResourceRoot $stage -LocalOnly:$localOnly
          $installer = Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter '*x64-setup.exe'
          if (@($installer).Count -ne 1) { throw 'Expected exactly one private NSIS candidate' }
          ./native/windows-x64/smoke-installer.ps1 -Installer $installer.FullName -Manifest "$stage/dlls.json"
      - name: Verify WASAPI when no output endpoint exists
        if: inputs.verify_no_output
        run: |
          # This job uses an ephemeral GitHub-hosted Windows VM. Start Core Audio
          # so zero endpoints can be distinguished from a stopped service.
          foreach ($name in 'AudioEndpointBuilder', 'Audiosrv') {
            if ((Get-Service $name).StartType -eq 'Disabled') {
              Set-Service -Name $name -StartupType Manual
            }
            Start-Service -Name $name
          }
          $stage = Join-Path $env:RUNNER_TEMP 'ECHO native próba 日本'
          $localOnly = '${{ inputs.local_only }}' -eq 'true'
          ./native/windows-x64/test-no-output.ps1 -ResourceRoot $stage -LocalOnly:$localOnly
