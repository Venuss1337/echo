name: Verify

on: [push, pull_request]

permissions:
  contents: read

jobs:
  windows:
    name: Windows static, unit, browser and native build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.17.0"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - run: rustup toolchain install 1.100.0 --profile minimal --component clippy,rustfmt
      - run: bun run verify
      - name: Native libmpv and loopback playback
        run: |
          $env:ECHO_VERIFIED_LIBMPV = & ./scripts/prepare-native-probe.ps1
          bun run test:native
      - run: bun run tauri build --no-bundle --debug -- --locked
  supply-chain:
    name: Dependency advisories and Rust licenses
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.5
      - run: bun run test:security
